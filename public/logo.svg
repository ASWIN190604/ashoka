<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <style>
      .logo-bg { fill: #ffffff; stroke: #0c2364; stroke-width: 6; rx: 28; }
      .ashoka-text {
        font-family: 'Times New Roman', Times, 'Cinzel', serif;
        font-size: 118px;
        font-weight: 700;
        fill: #991b1e;
        letter-spacing: 0.04em;
      }
      .press-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #0c2364;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Blue Border -->
  <rect x="8" y="8" width="984" height="284" rx="28" fill="#ffffff" stroke="#0c2364" stroke-width="7"/>

  <!-- Left AP Monogram Emblem -->
  <g transform="translate(48, 38)">
    <!-- Red Top Left Swoosh Arc -->
    <path d="M 98 12 C 46 16 12 55 12 110 C 12 128 16 142 24 156 C 24 136 32 118 46 102 C 38 78 52 42 88 18 L 98 12 Z" fill="#991b1e"/>
    
    <!-- Red Top Right Swoosh Arc -->
    <path d="M 104 12 C 148 12 188 44 198 88 C 188 78 174 72 158 72 C 130 72 108 90 98 114 C 92 106 84 98 74 88 L 104 22 Z" fill="#991b1e"/>

    <!-- Red Inner 'A' Arrow/Chevron -->
    <path d="M 66 84 L 126 144 L 98 144 L 84 126 L 56 126 L 46 144 L 20 144 L 66 84 Z" fill="#991b1e"/>

    <!-- Blue Bottom 'P' Crescent -->
    <path d="M 44 144 L 140 144 C 182 144 206 172 206 200 C 206 208 198 218 180 224 C 148 214 126 195 88 195 C 64 195 44 206 32 216 C 54 228 82 234 112 234 C 168 234 214 195 220 138 C 220 130 204 122 178 122 L 44 122 L 44 144 Z" fill="#0c2364"/>

    <!-- Blue Lower Stem -->
    <path d="M 44 144 L 94 214 L 66 214 L 38 172 L 38 214 L 18 214 L 18 144 L 44 144 Z" fill="#0c2364"/>
  </g>

  <!-- Brand Typography -->
  <!-- ASHOKA -->
  <text x="280" y="165" class="ashoka-text">ASHOKA</text>

  <!-- Blue Underline -->
  <line x1="270" y1="188" x2="945" y2="188" stroke="#0c2364" stroke-width="5.5" stroke-linecap="square"/>

  <!-- PHOTOSTAT AND PRINTING PRESS -->
  <text x="285" y="242" class="press-text">PHOTOSTAT AND PRINTING PRESS</text>
</svg>
